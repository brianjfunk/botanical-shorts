# Botanical Shorts pipeline settings.
# Secrets are never stored here -- see README for the environment variables.

source:
  # v1 is botanical-only, per the scope decision. Widening to the broader
  # natural-history pool is adding subjects to this list -- nothing else
  # in the pipeline is scope-aware.
  #
  # To widen, append e.g.:
  #   - "Zoological illustration"
  #   - "Entomology"
  #   - "Birds"
  # Confirmed live via `find-subjects`. "Botany, Pictorial works" and "Plants
  # Pictorial works" were removed: both returned ZERO title-level publications,
  # so the channel had been running on one subject the whole time. Nothing
  # failed loudly, because a heading that does not exist looks exactly like one
  # that is merely thin -- check any new subject with `find-subjects` first.
  #
  # Title counts as measured:
  #   botany                 5990
  #   Botanical illustration  152
  subjects:
    - "Botanical illustration"
    - "botany"

  # BHL flags page types per scanned page. "Illustration" is the plate marker;
  # run `verify-bhl` to confirm the exact strings your queries return.
  page_types:
    - "Illustration"
    - "Foldout"

  # The plate-embedded lettering era. Captions engraved onto the plate itself
  # are near-universal in this window and become less reliable outside it.
  year_min: 1700
  year_max: 1920

  # How many titles per subject the walk may consider. This is the real limit
  # on pool depth: 'botany' offers 5988 titles, but at 60 the walk only ever
  # saw 120 of them, which is why raising the subject count alone changed
  # nothing measurable.
  #
  # Raising it is close to free. The walk is lazy and stops at the first
  # publishable plate, and a title on cooldown is skipped before its metadata
  # call -- so a bigger window costs API calls only when the leading titles
  # yield nothing.
  titles_per_subject: 400
  max_items_per_title: 3
  # Cap per volume so one heavily-illustrated book cannot dominate the pool.
  max_pages_per_item: 6
  max_candidates: 400
  # Works stay locked for this many published videos: 120 is about 5.5 months
  # at five a week.
  #
  # Bounded by distinct usable titles, which a survey put at 257 once
  # titles_per_subject reached 400. Deliberately under half of that rather than
  # the 130 a full six months would need, because the two failure directions
  # are not symmetric: too short means an occasional near-repeat, which is
  # survivable and which Brian judged acceptable months apart. Too long means
  # the walk finds no unlocked work, the run publishes nothing, and the channel
  # silently goes quiet.
  title_cooldown: 120

license:
  # Allowlist, matched case-insensitively as substrings against BHL's
  # per-item rights and licence fields. Anything unmatched is rejected.
  allowed_rights:
    - "public domain"
    - "no known copyright"
    - "not in copyright"
    - "cc0"
  allowed_licenses:
    - "cc0"
    - "public domain"
    - "publicdomain"
    - "cc by"
    - "creative commons attribution"
  # Fail closed when BHL reports nothing at all.
  allow_unknown: false

vision:
  enabled: true
  model: "claude-sonnet-5"
  # v1: record the caption verdict, do not reject on it. Flip to "hard_gate"
  # once the logged verdicts look trustworthy against real output.
  caption_mode: "log_only"
  # Scan quality IS enforced from day one.
  min_scan_quality: 7
  # Bounds spend if the pool is full of poor scans on a given day.
  max_vision_calls: 12

image:
  width: 1080
  height: 1920
  # Breathing room around the plate, as a fraction of each edge.
  margin_ratio: 0.06
  # Signed off: fill margins with the plate's own sampled paper tone.
  letterbox: "sampled_paper"
  # Used when letterbox is "fixed", and as the fallback when a scan's border
  # samples as scanner void rather than paper.
  fixed_fill_color: "#E8DEC9"
  # Subtle translucent keyline around the plate edge; 0 disables.
  border_px: 2
  border_color: "#00000026"
  min_source_width: 700
  min_source_height: 900
  # Skip strongly-landscape plates: fitted into 9:16 without cropping they
  # occupy a thin band mid-frame, and cropping to fill would risk clipping the
  # plate's engraved caption. Most bound plates are portrait.
  max_source_aspect: 1.25
  # Both learned from building the channel art, where the same faults were
  # obvious the moment a dozen plates sat side by side.
  #
  # A scan whose own edge is dark -- a black scan frame, a dark mount, a
  # photograph shot against cloth -- makes sampled_paper fall back to
  # parchment, leaving a hard rectangle on a parchment field.
  # 140 was set to catch scanner void (which reads 0-6) but was also rejecting
  # ordinary dark or browned stock at 70-120, costing about a quarter of the
  # pool. 60 still clears a black frame by a wide margin.
  min_border_luminance: 60
  # A faint pencil study is a clean scan, so scan_quality rates it highly, and
  # it still frames as an empty page.
  min_ink_coverage: 0.05

video:
  # Short by design: on a truly static frame the loop point is invisible, so a
  # brief clip maximises loop count within a viewer's dwell time.
  duration_seconds: 2.0
  fps: 30
  crf: 18

upload:
  # Re-enabled after the wrong-channel incident: the first real upload landed
  # on a personal channel because the consent flow was completed with that
  # channel selected. The token has since been re-minted against
  # @TheHerbalShorts and the old grant revoked.
  #
  # Note the binding is NOT machine-verified: the current token carries only
  # the youtube.upload scope, which is write-only and cannot read back which
  # channel it publishes to. Re-run scripts/get_youtube_refresh_token.py to
  # pick up youtube.readonly and `check-youtube` will name the channel outright
  # -- worth doing before any large batch.
  enabled: true
  privacy_status: "private"
  # The passive veto window -- auto-publishes unless pulled in Studio.
  publish_delay_hours: 24
  # 22 = People & Blogs. 27 = Education.
  category_id: "27"
  tags:
    - "botanical illustration"
    - "natural history"
    - "public domain"
    - "vintage botanical"
    - "biodiversity heritage library"
  made_for_kids: false

notify:
  enabled: true
  channel_hint: "set SLACK_WEBHOOK_URL to receive the daily review ping"

history_path: "state/history.json"
output_dir: "build"
