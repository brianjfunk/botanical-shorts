name: Daily plate

# NOTE: GitHub only schedules workflows from the DEFAULT branch, and
# workflow_dispatch only lists workflows present there. Until this file is
# merged to the default branch the cron will never fire and the Run workflow
# button will not appear.

# The weekday cron is DELIBERATELY GONE. It published one plate straight to the
# channel with nobody looking, which is the one path that can put an unreviewed
# frame in front of viewers now that build/publish batches exist. Selection is
# no longer a thing that happens on a timer: a batch is built, looked at once,
# and only then published.
#
# Kept as a dispatch-only workflow because it is still the way to produce a
# single plate on demand -- for a smoke test after a gate change, or to check a
# credential end to end. Restoring the schedule means restoring unreviewed
# uploads, so do it only if the review step is deliberately being dropped.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Select and frame only -- no render, no upload"
        type: boolean
        default: false
      skip_upload:
        description: "Render but do not upload"
        type: boolean
        default: false
      count:
        description: "How many plates to produce (use >1 only to seed a new channel)"
        type: string
        default: "1"

concurrency:
  group: daily-plate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Sized for the seeding batch, not the daily single. History is committed
    # once, after the whole run: a timeout mid-batch loses the record of every
    # video already uploaded, and the next run would publish them again.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          BHL_API_KEY: ${{ secrets.BHL_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python -m botanical_shorts.cli run \
            --count "${{ inputs.count || '1' }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.skip_upload && '--skip-upload' || '' }}

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plate-${{ github.run_number }}
          path: |
            build/*.png
            build/*.mp4
            build/summary.json
          if-no-files-found: ignore
          retention-days: 14

      # Runs even when the pipeline step failed. A batch that produces fewer
      # plates than asked for exits non-zero, but the videos it *did* upload
      # are already live -- gating this on success would leave them unrecorded
      # and the next run would publish them a second time. The history file is
      # written after each upload, so whatever is on disk is accurate.
      - name: Commit history
        if: always() && !inputs.dry_run && !inputs.skip_upload
        run: |
          if git diff --quiet -- state/history.json; then
            echo "history unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/history.json
          git commit -m "Record published plate ($(date -u +%Y-%m-%d))"
          # The runner is ephemeral, so this commit is the only durable record
          # of what has been published. Rebase in case a concurrent run landed.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 4))
          done
          echo "::error::could not push history update"
          exit 1
