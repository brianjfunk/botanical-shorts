name: Sample plates

# Renders a contact sheet of what a subject would actually publish, running
# the real licence and image gates, and commits it so it can be reviewed on
# github.com from a phone.
#
# Exists because counting titles answers whether a category is *supplied* and
# says nothing about whether it suits the channel: 'Reptiles, Fossil' has 260
# titles of bone diagrams. Deciding that by eye before a category goes live is
# far cheaper than deciding it after.

on:
  workflow_dispatch:
    inputs:
      subjects:
        description: "BHL subject headings, semicolon-separated (e.g. Jellyfishes;Corals;Shells)"
        type: string
        required: true
      label:
        description: "Folder name under samples/ (blank = derived from the first subject)"
        type: string
        default: ""
      count:
        description: "How many plates to show"
        type: string
        default: "12"

concurrency:
  group: sample-plates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Inputs come through the environment, never interpolated into the
      # script. A subject like 'Reptiles, Fossil' carries a comma, and quoting
      # it in the input made ${{ }} substitution close the surrounding string
      # early -- git then read the tail as a pathspec. Semicolons separate
      # subjects so commas inside a heading stay part of it.
      - name: Render the contact sheet
        env:
          BHL_API_KEY: ${{ secrets.BHL_API_KEY }}
          SUBJECTS: ${{ inputs.subjects }}
          LABEL: ${{ inputs.label }}
          COUNT: ${{ inputs.count }}
        run: |
          if [ -z "$BHL_API_KEY" ]; then
            echo "::error::BHL_API_KEY is not set."
            exit 1
          fi
          IFS=';' read -ra SUBJ <<< "$SUBJECTS"
          ARGS=(--count "${COUNT:-12}")
          if [ -n "$LABEL" ]; then
            ARGS+=(--label "$LABEL")
          fi
          python -m botanical_shorts.cli -v sample-plates "${SUBJ[@]}" "${ARGS[@]}"

      - name: Commit the samples
        env:
          SUBJECTS: ${{ inputs.subjects }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage before testing for changes: git diff ignores untracked files,
          # so a brand-new sample folder would read as "nothing to do".
          git add samples/
          if git diff --cached --quiet -- samples/; then
            echo "samples unchanged"
            exit 0
          fi
          git commit -m "Sample plates: $SUBJECTS"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 4))
          done
          echo "::error::could not push the samples"
          exit 1

      - name: Upload the samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-plates
          path: samples/
          if-no-files-found: ignore
          retention-days: 30
