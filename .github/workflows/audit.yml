name: Audit pool

# A validation exercise, not part of the publishing loop. Uploads nothing,
# records nothing, and touches no history: it walks a slice of the pool, runs
# every gate over every candidate without stopping at the first pass, and lays
# the result out as one page grouped by which gate judged what.
#
# The daily run can only ever report "98 rejected at download", which is
# equally consistent with the gate saving you from black scan frames and with
# it throwing away good plates. This is how you tell those apart.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "gates audit, or the aspect-band audit"
        type: choice
        options: [gates, aspect]
        default: gates
      count:
        description: "gates: candidates to judge / aspect: candidates per category"
        type: string
        default: "120"
      vision_calls:
        description: "how many survivors to send to the model (0 = free, local gates only)"
        type: string
        default: "0"

concurrency:
  group: audit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Inputs travel through the environment, never interpolated into the
      # script -- the same quoting hazard that broke sample-plates.
      - name: Audit the pool
        if: inputs.mode == 'gates'
        env:
          BHL_API_KEY: ${{ secrets.BHL_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COUNT: ${{ inputs.count }}
          VISION_CALLS: ${{ inputs.vision_calls }}
        run: |
          python -m botanical_shorts.cli -v audit-pool \
            --count "${COUNT:-120}" --vision-calls "${VISION_CALLS:-0}"

      - name: Audit the aspect bands
        if: inputs.mode == 'aspect'
        env:
          BHL_API_KEY: ${{ secrets.BHL_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COUNT: ${{ inputs.count }}
        run: |
          python -m botanical_shorts.cli -v aspect-audit \
            --per-category "${COUNT:-120}"

      # Committed rather than left as an artefact: artefact downloads go
      # through a blob host the review proxy blocks, so the page has to reach
      # the repository to be readable.
      - name: Commit the audit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Pool audit ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 4))
          done
          echo "::error::could not push the audit"
          exit 1
