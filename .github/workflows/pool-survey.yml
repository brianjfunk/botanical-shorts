name: Pool survey

# Measures how deep the usable plate pool is, and across how many distinct
# works. That title count is what sets the ceiling on a title-level cooldown:
# a cooldown of N videos needs N distinct usable titles to rotate through, and
# a serial like Edwards's Botanical Register contributes thousands of plates
# but only one title.
#
# Read-only and uploads nothing. Separate from `verify` because it walks the
# whole candidate pool and fetches a sample of scans, so it takes far longer
# than a verification run should.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Candidates to walk"
        type: string
        default: "1500"
      sample:
        description: "Plates to fetch for the image gates"
        type: string
        default: "60"
      titles:
        description: "Override source.titles_per_subject (blank = use config)"
        type: string
        default: ""
      subjects:
        description: "Optional: measure these subjects instead of the configured ones (space-separated, quote multi-word)"
        type: string
        default: ""
      find_subjects:
        description: "Optional: space-separated terms to search for real BHL subject headings"
        type: string
        default: ""
      backfill_history:
        description: "Resolve title_id for older history entries and commit"
        type: boolean
        default: false

concurrency:
  group: pool-survey
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Survey the pool
        env:
          BHL_API_KEY: ${{ secrets.BHL_API_KEY }}
        run: |
          if [ -z "$BHL_API_KEY" ]; then
            echo "::error::BHL_API_KEY is not set; cannot survey."
            exit 1
          fi
          ARGS="--limit ${{ inputs.limit || '1500' }} --sample ${{ inputs.sample || '60' }}"
          if [ -n "${{ inputs.titles }}" ]; then
            ARGS="$ARGS --titles ${{ inputs.titles }}"
          fi
          if [ -n "${{ inputs.subjects }}" ]; then
            ARGS="$ARGS --subjects ${{ inputs.subjects }}"
          fi
          python -m botanical_shorts.cli pool-survey $ARGS | tee survey.txt

      # Two of three configured subjects returned zero titles, and nothing
      # failed loudly: a heading that does not exist looks exactly like one
      # that is merely thin.
      - name: Find real subject headings
        if: inputs.find_subjects != ''
        env:
          BHL_API_KEY: ${{ secrets.BHL_API_KEY }}
        run: python -m botanical_shorts.cli find-subjects ${{ inputs.find_subjects }} | tee -a survey.txt

      # The cooldown works off title_id; entries recorded before it was tracked
      # are invisible to it, so the already-published works would not lock.
      - name: Backfill history title ids
        if: inputs.backfill_history
        env:
          BHL_API_KEY: ${{ secrets.BHL_API_KEY }}
        run: |
          python -m botanical_shorts.cli backfill-history
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/history.json
          if git diff --cached --quiet -- state/history.json; then
            echo "history unchanged"
            exit 0
          fi
          git commit -m "Backfill title_id on published history"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 4))
          done
          echo "::error::could not push the backfilled history"
          exit 1

      - name: Upload survey
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pool-survey
          path: survey.txt
          if-no-files-found: ignore
          retention-days: 30
